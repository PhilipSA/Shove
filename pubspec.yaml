name: shove
description: "A chess like game about shoving piece"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: 3.8.1

dependencies:
  audioplayers: ^5.2.1
  flutter_svg: ^2.0.9
  path_drawing: ^1.0.1
  json_annotation: ^4.7.0
  provider: ^6.1.1
  squadron: ^5.1.6
  squadron_builder: ^2.4.4

  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  json_serializable: ^6.7.1
  build_runner: ^2.3.0
  build_web_compilers: ^4.0.3
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/textures/
    - assets/sounds/
    - assets/sounds/music/